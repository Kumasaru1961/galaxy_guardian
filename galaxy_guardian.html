<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハロウィン・カボチャ・パニック</title>
    <style>
        body {
            background-color: #12081c;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff7700;
            text-shadow: 0 0 10px rgba(255, 119, 0, 0.5);
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(255, 119, 0, 0.3);
            border: 2px solid #552266;
        }
        canvas {
            background-color: #080312;
            display: block;
        }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #cc99ff;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>HALLOWEEN PUMPKIN PANIC</h1>
    <div id="game-container">
        <canvas id="canvas" width="480" height="600"></canvas>
    </div>
    <div class="info">
        移動: [←] [→] または [A] [D] / 発射: [↑] または [W] / リスタート: [R]
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- ハロウィン風Web Audio API ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // 怪しげなハロウィンBGM（マイナーコード風の音階）
    if (type === 'bgm1' || type === 'bgm2' || type === 'bgm3' || type === 'bgm4') {
        osc.type = 'sawtooth';
        let freq = 130.81; // C3
        if (type === 'bgm2') freq = 155.56; // Eb3
        if (type === 'bgm3') freq = 146.83; // D3
        if (type === 'bgm4') freq = 123.47; // B2

        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gainNode.gain.setValueAtTime(0.12, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'shoot') {
        // 魔法のビーム音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'pumpkinKilled') {
        // カボチャが割れるような音
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'midBossKilled') {
        // おばけ撃破時の陽気なファンファーレ
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    } else if (type === 'bossKilled') {
        // 魔王カボチャ撃破音
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
    } else if (type === 'playerHit') {
        // 被弾音
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.35);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    } else if (type === 'gameover') {
        // 不気味なゲームオーバー音 ＋ ぽよよーん
        const notes = [196, 185, 174.61, 164.81]; 
        notes.forEach((freq, index) => {
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            
            subOsc.type = 'sawtooth';
            subOsc.frequency.setValueAtTime(freq, now + index * 0.35);
            subGain.gain.setValueAtTime(0.2, now + index * 0.35);
            subGain.gain.linearRampToValueAtTime(0.01, now + index * 0.35 + 0.3);
            
            subOsc.start(now + index * 0.35);
            subOsc.stop(now + index * 0.35 + 0.3);
        });

        const poyonTimes = [1.5, 1.75, 2.0];
        const poyonFreqs = [
            { start: 180, end: 400 },
            { start: 220, end: 450 },
            { start: 260, end: 550 }
        ];

        poyonTimes.forEach((t, i) => {
            const pOsc = audioCtx.createOscillator();
            const pGain = audioCtx.createGain();
            pOsc.connect(pGain);
            pGain.connect(audioCtx.destination);

            pOsc.type = 'sine';
            pOsc.frequency.setValueAtTime(poyonFreqs[i].start, now + t);
            pOsc.frequency.linearRampToValueAtTime(poyonFreqs[i].end, now + t + 0.25);

            pGain.gain.setValueAtTime(0.18, now + t);
            pGain.gain.linearRampToValueAtTime(0.01, now + t + 0.25);

            pOsc.start(now + t);
            pOsc.stop(now + t + 0.25);
        });
    }
}

// ゲーム状態
let score = 0;
let lives = 3;
let gameState = 'START';
let level = 1;
let gameOverTimer = 0;

// プレイヤー（魔女のホウキ / 魔法の乗り物）
const player = {
    x: canvas.width / 2 - 15,
    y: canvas.height - 50,
    width: 30,
    height: 18,
    speed: 5
};

let bullets = [];
const bulletSpeed = 7;
let enemyBullets = [];
const enemyBulletSpeed = 3;

// カボチャインベーダー配列
let pumpkins = [];
const pumpkinRows = 4;
const pumpkinCols = 8;
let pumpkinWidth = 34;
let pumpkinHeight = 26;
let pumpkinPadding = 12;
let pumpkinOffsetTop = 60;
let pumpkinOffsetLeft = 35;
let pumpkinDirection = 1;
let animFrame = 0;
let moveTimer = 0;
let moveInterval = 30;

let bgmStep = 0;
let bgmTimer = 0;

// 中間ボス（おばけ・ゴースト型）
let midBoss = {
    x: -50,
    y: 40,
    width: 52,
    height: 24,
    hp: 3,
    maxHp: 3,
    speed: 2,
    active: false,
    direction: 1,
    timer: 0
};

// ラスボス（魔王パンプキン・キング）
let boss = {
    x: canvas.width / 2 - 50,
    y: 35,
    width: 100,
    height: 42,
    hp: 12,
    maxHp: 12,
    speed: 1.5,
    active: false,
    direction: 1
};

// お墓風のシールド（墓石）
let tombstones = [];

function initTombstones() {
    tombstones = [];
    const stoneCount = 4;
    const stoneWidth = 60;
    const spacing = (canvas.width - (stoneWidth * stoneCount)) / (stoneCount + 1);

    for (let i = 0; i < stoneCount; i++) {
        let startX = spacing + i * (stoneWidth + spacing);
        let startY = canvas.height - 120;
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 10; c++) {
                tombstones.push({
                    x: startX + c * 6,
                    y: startY + r * 6,
                    width: 6,
                    height: 6,
                    alive: true
                });
            }
        }
    }
}

function initPumpkins() {
    pumpkins = [];
    midBoss.active = false;
    midBoss.timer = 0;

    if (level % 3 === 0) {
        boss.active = true;
        boss.hp = 10 + (level * 2);
        boss.maxHp = boss.hp;
        boss.x = canvas.width / 2 - boss.width / 2;
        return;
    }

    boss.active = false;
    for (let r = 0; r < pumpkinRows; r++) {
        for (let c = 0; c < pumpkinCols; c++) {
            let type = r === 0 ? 3 : (r <= 2 ? 2 : 1);
            pumpkins.push({
                x: pumpkinOffsetLeft + c * (pumpkinWidth + pumpkinPadding),
                y: pumpkinOffsetTop + r * (pumpkinHeight + pumpkinPadding),
                width: pumpkinWidth,
                height: pumpkinHeight,
                type: type,
                alive: true
            });
        }
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    moveInterval = 30;
    startGame();
}

function startGame() {
    initAudio();
    player.x = canvas.width / 2 - player.width / 2;
    bullets = [];
    enemyBullets = [];
    gameOverTimer = 0;
    initPumpkins();
    initTombstones();
    gameState = 'PLAYING';
}

const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (gameState === 'PLAYING') {
            if (bullets.filter(b => b.isPlayer).length < 2) {
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: 4,
                    height: 12,
                    isPlayer: true
                });
                playSound('shoot');
            }
        } else if (gameState === 'GAMEOVER' && gameOverTimer > 60) {
            resetGame();
        } else if (gameState === 'START') {
            resetGame();
        }
        e.preventDefault();
    }
    
    if (e.code === 'Space') {
        if (gameState !== 'PLAYING') {
            if (gameState !== 'GAMEOVER' || gameOverTimer > 60) {
                resetGame();
            }
        }
        e.preventDefault();
    }

    if (e.code === 'KeyR') {
        resetGame();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

function rectIntersect(r1, r2) {
    return r1.x < r2.x + r2.width &&
           r1.x + r1.width > r2.x &&
           r1.y < r2.y + r2.height &&
           r1.y + r1.height > r2.y;
}

function update() {
    if (gameState === 'GAMEOVER') {
        gameOverTimer++;
        return;
    }
    if (gameState !== 'PLAYING') return;

    let livingCount = boss.active ? 1 : pumpkins.filter(p => p.alive).length;
    let maxCount = boss.active ? 1 : (pumpkinRows * pumpkinCols);
    let tempo = Math.max(10, Math.floor(35 * (livingCount / maxCount)));

    bgmTimer++;
    if (bgmTimer >= tempo) {
        bgmTimer = 0;
        bgmStep = (bgmStep % 4) + 1;
        playSound('bgm' + bgmStep);
    }

    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.x -= player.speed;
        if (player.x < 0) player.x = 0;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        player.x += player.speed;
        if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if (b.isPlayer) {
            b.y -= bulletSpeed;
            if (b.y < 0) {
                bullets.splice(i, 1);
                continue;
            }

            // ラスボスとの当たり判定
            if (boss.active && rectIntersect(b, boss)) {
                boss.hp--;
                bullets.splice(i, 1);
                playSound('pumpkinKilled');
                if (boss.hp <= 0) {
                    boss.active = false;
                    score += 1500;
                    playSound('bossKilled');
                    level++;
                    initPumpkins();
                }
                continue;
            }

            // 中間ボスとの当たり判定 (1UP)
            if (midBoss.active && rectIntersect(b, midBoss)) {
                midBoss.hp--;
                bullets.splice(i, 1);
                playSound('pumpkinKilled');
                if (midBoss.hp <= 0) {
                    midBoss.active = false;
                    score += 600;
                    lives++;
                    playSound('midBossKilled');
                }
                continue;
            }

            // 通常カボチャとの当たり判定
            let hit = false;
            for (let p of pumpkins) {
                if (p.alive && rectIntersect(b, p)) {
                    p.alive = false;
                    score += p.type * 15;
                    hit = true;
                    playSound('pumpkinKilled');
                    break;
                }
            }
            if (hit) {
                bullets.splice(i, 1);
                if (pumpkins.length > 0 && pumpkins.every(p => !p.alive)) {
                    level++;
                    moveInterval = Math.max(10, moveInterval - 5);
                    initPumpkins();
                }
                continue;
            }

            // 墓石シールド
            let stoneHit = false;
            for (let s of tombstones) {
                if (s.alive && rectIntersect(b, s)) {
                    s.alive = false;
                    stoneHit = true;
                    break;
                }
            }
            if (stoneHit) {
                bullets.splice(i, 1);
                continue;
            }

        } else {
            b.y += enemyBulletSpeed;
            if (b.y > canvas.height) {
                bullets.splice(i, 1);
                continue;
            }

            if (rectIntersect(b, player)) {
                bullets.splice(i, 1);
                lives--;
                playSound('playerHit');
                if (lives <= 0) {
                    gameState = 'GAMEOVER';
                    gameOverTimer = 0;
                    playSound('gameover');
                } else {
                    player.x = canvas.width / 2 - player.width / 2;
                }
                continue;
            }

            let stoneHit = false;
            for (let s of tombstones) {
                if (s.alive && rectIntersect(b, s)) {
                    s.alive = false;
                    stoneHit = true;
                    break;
                }
            }
            if (stoneHit) {
                bullets.splice(i, 1);
                continue;
            }
        }
    }

    if (!boss.active) {
        if (!midBoss.active) {
            midBoss.timer++;
            if (midBoss.timer > 350 && Math.random() < 0.012) {
                midBoss.active = true;
                midBoss.hp = 3;
                midBoss.maxHp = 3;
                midBoss.direction = Math.random() < 0.5 ? 1 : -1;
                midBoss.x = midBoss.direction === 1 ? -midBoss.width : canvas.width;
                midBoss.timer = 0;
            }
        } else {
            midBoss.x += midBoss.speed * midBoss.direction;
            if (midBoss.x > canvas.width + 50 || midBoss.x < -50) {
                midBoss.active = false;
            }
        }
    }

    if (boss.active) {
        boss.x += boss.speed * boss.direction;
        if (boss.x <= 20 || boss.x + boss.width >= canvas.width - 20) {
            boss.direction *= -1;
        }
        if (Math.random() < 0.04) {
            bullets.push({
                x: boss.x + boss.width / 2 - 2,
                y: boss.y + boss.height,
                width: 5,
                height: 14,
                isPlayer: false
            });
        }
    } else {
        moveTimer++;
        if (moveTimer >= moveInterval) {
            moveTimer = 0;
            animFrame = 1 - animFrame;

            let edgeHit = false;
            let livingPumpkins = pumpkins.filter(p => p.alive);
            
            livingPumpkins.forEach(p => {
                p.x += 8 * pumpkinDirection;
                if (p.x + p.width > canvas.width - 15 || p.x < 15) {
                    edgeHit = true;
                }
                if (p.y + p.height >= player.y) {
                    gameState = 'GAMEOVER';
                    gameOverTimer = 0;
                    playSound('gameover');
                }
            });

            if (edgeHit) {
                pumpkinDirection *= -1;
                livingPumpkins.forEach(p => {
                    p.y += 12;
                });
            }
        }

        let livingPumpkins = pumpkins.filter(p => p.alive);
        if (livingPumpkins.length > 0 && Math.random() < 0.02 + (level * 0.005)) {
            let shooter = livingPumpkins[Math.floor(Math.random() * livingPumpkins.length)];
            bullets.push({
                x: shooter.x + shooter.width / 2 - 2,
                y: shooter.y + shooter.height,
                width: 4,
                height: 12,
                isPlayer: false
            });
        }
    }
}

// ラスボス（魔王パンプキン・キング）の描画
function drawBoss() {
    if (!boss.active) return;
    
    // 本体（巨大カボチャ王）
    ctx.fillStyle = '#ff5500';
    ctx.fillRect(boss.x + 10, boss.y + 12, boss.width - 20, 26);
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(boss.x + 20, boss.y + 6, boss.width - 40, 32);

    // 王冠
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(boss.x + 35, boss.y, 30, 8);
    ctx.fillRect(boss.x + 40, boss.y - 6, 6, 6);
    ctx.fillRect(boss.x + 54, boss.y - 6, 6, 6);

    // 不気味な目と口
    ctx.fillStyle = '#220011';
    ctx.fillRect(boss.x + 24, boss.y + 14, 12, 10);
    ctx.fillRect(boss.x + 64, boss.y + 14, 12, 10);
    ctx.fillRect(boss.x + 32, boss.y + 28, 36, 6);

    // HPゲージ
    ctx.fillStyle = '#441122';
    ctx.fillRect(boss.x, boss.y - 12, boss.width, 5);
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(boss.x, boss.y - 12, boss.width * (boss.hp / boss.maxHp), 5);
}

// 中間ボス（ゴーストおばけ）の描画
function drawMidBoss() {
    if (!midBoss.active) return;
    ctx.fillStyle = '#eeccff';
    ctx.fillRect(midBoss.x + 12, midBoss.y + 4, midBoss.width - 24, 14);
    ctx.fillRect(midBoss.x + 6, midBoss.y + 10, midBoss.width - 12, 10);
    // 目
    ctx.fillStyle = '#440066';
    ctx.fillRect(midBoss.x + 16, midBoss.y + 8, 4, 6);
    ctx.fillRect(midBoss.x + 32, midBoss.y + 8, 4, 6);
    // HPゲージ
    ctx.fillStyle = '#441122';
    ctx.fillRect(midBoss.x, midBoss.y - 6, midBoss.width, 3);
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(midBoss.x, midBoss.y - 6, midBoss.width * (midBoss.hp / midBoss.maxHp), 3);
}

// カボチャインベーダーの描画（ジャック・オー・ランタン風）
function drawPumpkin(p) {
    if (!p.alive) return;
    
    if (p.type === 3) ctx.fillStyle = '#ff3300';
    else if (p.type === 2) ctx.fillStyle = '#ff6600';
    else ctx.fillStyle = '#ff9900';

    // カボチャ本体
    if (animFrame === 0) {
        ctx.fillRect(p.x + 4, p.y + 4, p.width - 8, p.height - 4);
        ctx.fillRect(p.x, p.y + 8, p.width, p.height - 12);
        // へた
        ctx.fillStyle = '#228822';
        ctx.fillRect(p.x + p.width / 2 - 3, p.y, 6, 6);
        // 目と口（くり抜き）
        ctx.fillStyle = '#050208';
        ctx.fillRect(p.x + 8, p.y + 10, 5, 6);
        ctx.fillRect(p.x + p.width - 13, p.y + 10, 5, 6);
        ctx.fillRect(p.x + 10, p.y + 18, p.width - 20, 3);
    } else {
        // アニメーション時の別ポーズ（ちょっと形が変わる）
        ctx.fillRect(p.x + 6, p.y + 4, p.width - 12, p.height - 4);
        ctx.fillRect(p.x + 2, p.y + 6, p.width - 4, p.height - 10);
        ctx.fillStyle = '#228822';
        ctx.fillRect(p.x + p.width / 2 - 3, p.y, 6, 6);
        ctx.fillStyle = '#050208';
        ctx.fillRect(p.x + 9, p.y + 11, 4, 5);
        ctx.fillRect(p.x + p.width - 13, p.y + 11, 4, 5);
        ctx.fillRect(p.x + 11, p.y + 17, p.width - 22, 4);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'START') {
        ctx.fillStyle = '#ff7700';
        ctx.font = '22px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('HALLOWEEN PUMPKIN PANIC', canvas.width / 2, canvas.height / 2 - 40);
        
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText('PRESS [↑] OR [W] TO START', canvas.width / 2, canvas.height / 2 + 20);
        return;
    }

    ctx.fillStyle = '#fff';
    ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`NIGHT: ${level}`, 200, 30);
    ctx.fillText(`BROOMS: ${'🧹 '.repeat(lives)}`, canvas.width - 140, 30);

    // 自機（魔女のホウキ / ナイトフライト機）の描画
    ctx.fillStyle = '#bb66ff';
    ctx.fillRect(player.x + player.width / 2 - 3, player.y, 6, player.height);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(player.x, player.y + 10, player.width, 8); // ほうきの柄・魔女のシート

    if (boss.active) {
        drawBoss();
    } else {
        pumpkins.forEach(drawPumpkin);
        drawMidBoss();
    }

    // お墓（シールド）の描画
    ctx.fillStyle = '#8888aa';
    tombstones.forEach(s => {
        if (s.alive) ctx.fillRect(s.x, s.y, s.width, s.height);
    });

    // 弾の描画（魔法の弾 / カボチャの弾）
    bullets.forEach(b => {
        ctx.fillStyle = b.isPlayer ? '#ffff00' : '#ff3399';
        ctx.fillRect(b.x, b.y, b.width, b.height);
    });

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(10, 4, 20, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let scaleFactor = Math.min(1.0, gameOverTimer / 45);
        let currentFontSize = Math.floor(32 * scaleFactor);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2 - 20);
        ctx.scale(scaleFactor, scaleFactor);

        ctx.fillStyle = '#ff2266';
        ctx.font = `bold ${currentFontSize}px "Courier New", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('HAPPY HALLOWEEN', 0, 0);
        ctx.restore();

        if (gameOverTimer > 50) {
            ctx.fillStyle = '#fff';
            ctx.font = '15px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('PRESS [↑] OR [W] TO RETRY', canvas.width / 2, canvas.height / 2 + 50);
        }
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

draw();
requestAnimationFrame(loop);
</script>

</body>
</html>
